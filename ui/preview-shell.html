<div id="axon-final-preview">
 <div class="preview-heading"><strong>Axon · le front final</strong><span>Simulation locale · aucun agent ni compte connecté</span></div>
 <div class="preview-controls" aria-label="Pages de l’overlay"><button data-page="home">Accueil</button><button data-page="etudes">Student</button><button data-page="suivi">Détail d’un suivi</button><button data-page="settings">Paramètres</button><button data-page="chat">Chat</button><button data-page="hitl">Validation HITL</button><button data-page="code">Fichiers</button><button data-page="integrations">Intégrations</button></div>
 <div class="preview-controls secondary" aria-label="Formulaires et intégrations"><button data-page="create">Nouveau suivi</button><button data-page="deadline">Nouvelle échéance</button><button data-page="gmail">Gmail</button><button data-page="workspace">Workspace</button><button data-page="slack">Slack</button><button data-page="jira">Jira</button></div>
 <div class="preview-desktop"><div class="desktop-caption"><span>axon / aperçu interactif</span><span id="axon-dimensions">780 × 280 px</span></div><iframe title="Axon Overlay — interface finale" id="axon-preview-frame"></iframe></div>
 <p class="preview-note">Les composants sont ceux du plugin. Les contenus et réponses sont fictifs. Les contrôles permettent d’explorer le front sans lancer d’action réelle.</p>
 <script type="application/json" id="axon-preview-document">__PREVIEW_DOCUMENT__</script>
</div>
<style>
#axon-final-preview{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8e0d8}#axon-final-preview *{box-sizing:border-box}#axon-final-preview .preview-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}#axon-final-preview .preview-heading strong{font-size:17px;font-weight:500;letter-spacing:-.4px}#axon-final-preview .preview-heading span{font-size:10px;color:#b1a6b5}#axon-final-preview .preview-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#axon-final-preview .preview-controls button{font:11px system-ui;color:#d3c5d6;background:#ffffff07;border:1px solid #ffffff13;border-radius:8px;padding:8px 10px;cursor:pointer}#axon-final-preview .preview-controls button:hover{background:#ffffff10}#axon-final-preview .preview-controls button[aria-pressed=true]{border-color:#e2bb8066;color:#edcea2;background:#e2bb8014}#axon-final-preview .preview-controls button:focus-visible{outline:2px solid #e2bb80;outline-offset:2px}#axon-final-preview .secondary button{font-size:10px;padding:6px 9px;color:#bfb0c4;background:transparent}#axon-final-preview .preview-desktop{margin-top:15px;padding:0 12px 32px;border-radius:18px;background:radial-gradient(ellipse at 4% 90%,#6b566b99,transparent 68%),radial-gradient(ellipse at 98% 5%,#52617090,transparent 60%),#242631;overflow:hidden}#axon-final-preview .desktop-caption{display:flex;justify-content:space-between;gap:10px;padding:14px 3px 22px;font-size:10px;color:#c5b8c9}#axon-final-preview #axon-dimensions{font:9px ui-monospace,monospace}#axon-final-preview iframe{display:block;border:0;width:780px;max-width:100%;height:280px;margin:auto;background:transparent;color-scheme:dark;border-radius:30px;box-shadow:0 18px 45px #08071233;transition:width 200ms ease,height 200ms ease}#axon-final-preview .preview-note{font-size:10px;line-height:1.7;color:#a99bad;margin:12px 2px 0}@media(prefers-reduced-motion:reduce){#axon-final-preview iframe{transition:none}}@media(max-width:440px){#axon-final-preview .preview-desktop{padding:0 5px 20px}#axon-final-preview .preview-controls button{padding:8px;font-size:10px}}
</style>
<script>
(()=>{
 const root=document.getElementById('axon-final-preview'),frame=root.querySelector('#axon-preview-frame');let selected='home';
 function mark(page){root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));}
 root.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.page;frame.contentWindow.postMessage({source:'axon-final-control',page:selected},'*');mark(selected);}));
 window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.source!=='axon-final-preview')return;const {width,height,view}=event.data;if(![560,780].includes(width)||![280,500,540].includes(height))return;frame.style.width=width+'px';frame.style.height=height+'px';root.querySelector('#axon-dimensions').textContent=width+' × '+height+' px';if(!['create','deadline','hitl','gmail','workspace','slack','jira'].includes(selected))mark(view);});
 frame.srcdoc=JSON.parse(root.querySelector('#axon-preview-document').textContent);mark('home');
})();
</script>
